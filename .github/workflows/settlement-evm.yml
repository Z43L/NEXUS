name: settlement-evm

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS/settlement-evm/**'
      - 'NEXUS/nexus/h0/**'
      - 'NEXUS/requirements-cryptography.lock'
      - 'NEXUS/nexus/api/**'
      - 'NEXUS/nexus-web/**'
      - '.github/workflows/settlement-evm.yml'
  pull_request:
    paths:
      - 'NEXUS/settlement-evm/**'
      - 'NEXUS/nexus/h0/**'
      - 'NEXUS/requirements-cryptography.lock'
      - 'NEXUS/nexus/api/**'
      - 'NEXUS/nexus-web/**'
      - '.github/workflows/settlement-evm.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: NEXUS/settlement-evm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Python batch builder tests
        run: "python -m pip install --require-hashes --only-binary=:all: -r ../nexus/h0/requirements-h0.txt && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests_python -v"
      - name: FastAPI local security regression tests
        run: python -m pip install --require-hashes -r ../nexus/api/requirements-h0.lock && PYTHONPATH=.. PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s ../nexus/api/tests -v
      - uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: v1.8.6
      - name: Solidity formatting
        run: forge fmt --check
      - name: Solidity tests
        run: forge test -vv
      - name: Local receipt-to-Anvil E2E
        run: python e2e_local.py
