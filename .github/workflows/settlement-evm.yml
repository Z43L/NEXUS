name: settlement-evm

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS/settlement-evm/**'
      - 'NEXUS/nexus/h0/**'
      - 'NEXUS/nexus/api/**'
      - '.github/workflows/settlement-evm.yml'
  pull_request:
    paths:
      - 'NEXUS/settlement-evm/**'
      - 'NEXUS/nexus/h0/**'
      - 'NEXUS/nexus/api/**'
      - '.github/workflows/settlement-evm.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NEXUS/settlement-evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python batch builder tests
        run: python -m pip install -r ../nexus/h0/requirements-h0.txt && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests_python -v
      - name: FastAPI local security regression tests
        run: python -m pip install --require-hashes -r ../nexus/api/requirements-h0.lock && PYTHONPATH=.. PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s ../nexus/api/tests -v
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: Solidity formatting
        run: forge fmt --check
      - name: Solidity tests
        run: forge test -vv
      - name: Local receipt-to-Anvil E2E
        run: python e2e_local.py
