<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS H0 · Chat local</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 780px; margin: 3rem auto; padding: 0 1rem; }
    header { border-bottom: 1px solid #8886; margin-bottom: 1.5rem; }
    h1 { margin-bottom: .2rem; }
    .muted { color: #888; }
    #status { min-height: 1.5rem; }
    #messages { display: grid; gap: .75rem; margin: 1.5rem 0; }
    .message { padding: .8rem 1rem; border-radius: .7rem; background: #8882; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { border-left: 4px solid #4c9; }
    .message.assistant { border-left: 4px solid #69c; }
    textarea, select, button { font: inherit; }
    textarea { box-sizing: border-box; width: 100%; min-height: 7rem; padding: .7rem; }
    .controls { display: flex; gap: .7rem; margin: .7rem 0; flex-wrap: wrap; }
    button { padding: .5rem 1rem; cursor: pointer; }
    button:disabled { cursor: wait; }
    #auth-panel { max-width: 28rem; }
    #auth-panel label { display: block; margin: .8rem 0 .2rem; }
    #auth-panel input { box-sizing: border-box; width: 100%; padding: .6rem; font: inherit; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="topline"><h1>NEXUS H0</h1><button id="logout" type="button" hidden>Cerrar sesión</button></div>
    <p class="muted">Chat local de texto · respuestas completas, sin streaming</p>
  </header>
  <section id="auth-panel" aria-labelledby="auth-title">
    <h2 id="auth-title">Iniciar sesión</h2>
    <form id="login-form" autocomplete="on">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" autocomplete="username" required maxlength="128">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
      <div class="controls"><button id="login" type="submit">Entrar</button></div>
    </form>
    <p id="auth-status" class="muted" role="status" aria-live="polite"></p>
  </section>
  <main id="authenticated-app" hidden>
  <p id="signed-in-as" class="muted"></p>
  <label for="model">Modelo anunciado</label>
  <div class="controls">
    <select id="model" disabled><option value="">Esperando modelos…</option></select>
    <label>Tokens <input id="tokens" type="number" min="1" max="4096" value="256"></label>
  </div>
  <div id="messages" aria-live="polite"></div>
  <section id="job-recovery" hidden aria-live="polite">
    <label for="pending-job-id">Trabajo pendiente</label>
    <div class="controls">
      <input id="pending-job-id" type="text" inputmode="text" autocomplete="off"
        pattern="job_[0-9]{1,12}" aria-describedby="job-recovery-help">
      <button id="resume-job" type="button">Continuar consulta</button>
    </div>
    <p id="job-recovery-help" class="muted">El ID se conserva en este navegador. Puedes continuar la consulta si una respuesta tarda más que la conexión.</p>
  </section>
  <form id="chat-form">
    <label for="prompt">Mensaje</label>
    <textarea id="prompt" required maxlength="150000" placeholder="Escribe un mensaje…"></textarea>
    <div class="controls"><button id="send" type="submit" disabled>Enviar</button><span id="status" class="muted"></span></div>
  </form>
  </main>
  <script>
    const authPanel = document.querySelector('#auth-panel');
    const authenticatedApp = document.querySelector('#authenticated-app');
    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login');
    const authStatus = document.querySelector('#auth-status');
    const logoutButton = document.querySelector('#logout');
    const passwordInput = document.querySelector('#password');
    const usernameInput = document.querySelector('#username');
    const signedInAs = document.querySelector('#signed-in-as');
    const form = document.querySelector('#chat-form');
    const promptInput = document.querySelector('#prompt');
    const messagesEl = document.querySelector('#messages');
    const modelSelect = document.querySelector('#model');
    const statusEl = document.querySelector('#status');
    const sendButton = document.querySelector('#send');
    const recoveryPanel = document.querySelector('#job-recovery');
    const pendingJobInput = document.querySelector('#pending-job-id');
    const resumeJobButton = document.querySelector('#resume-job');
    const history = [];
    const MAX_REQUEST_BYTES = 1_048_576;
    const MAX_TOTAL_CHARS = 150_000;
    const JOB_ID_PATTERN = /^job_[0-9]{1,12}$/;
    let authenticated = false;
    function readPendingJob() {
      try { return localStorage.getItem('nexus.h0.pendingJob') || ''; }
      catch { return ''; }
    }
    function savePendingJob(jobId) {
      try { localStorage.setItem('nexus.h0.pendingJob', jobId); } catch { /* optional recovery */ }
    }
    function clearPendingJob() {
      try { localStorage.removeItem('nexus.h0.pendingJob'); } catch { /* optional recovery */ }
    }
    let pendingJobId = '';

    function showPendingJob(jobId) {
      if (!JOB_ID_PATTERN.test(jobId)) return;
      pendingJobId = jobId;
      pendingJobInput.value = jobId;
      recoveryPanel.hidden = false;
      savePendingJob(jobId);
    }

    function addMessage(role, content) {
      const article = document.createElement('article');
      article.className = `message ${role}`;
      const title = document.createElement('strong');
      title.textContent = role === 'user' ? 'Tú' : 'NEXUS';
      const text = document.createElement('div');
      text.textContent = content;
      article.append(title, text);
      messagesEl.append(article);
    }

    async function recoverTimedOutJob(jobId, attempts = 60) {
      for (let attempt = 0; attempt < attempts; attempt++) {
        await new Promise(resolve => setTimeout(resolve, 5000));
        const response = await fetch(`/jobs/${encodeURIComponent(jobId)}`, {
          cache: 'no-store', credentials: 'same-origin'
        });
        const job = await response.json();
        if (response.status === 401) {
          showSignedOut('La sesión ha caducado. Vuelve a iniciar sesión.');
          throw new Error('La sesión ha caducado.');
        }
        if (!response.ok) throw new Error(`No se pudo consultar ${jobId}: ${job.error || response.status}`);
        if (job.status === 'done' && typeof job.output_text === 'string') return job.output_text;
        if (['failed', 'rejected'].includes(job.status)) {
          throw new Error(`${jobId} terminó con estado ${job.status}${job.error ? `: ${job.error}` : ''}`);
        }
        statusEl.textContent = `${jobId}: ${job.status || 'en curso'} · comprobación ${attempt + 1}/${attempts}`;
      }
      throw new Error(`${jobId} sigue en curso. Conserva este ID para consultar el estado.`);
    }

    async function loadModels() {
      modelSelect.disabled = true;
      sendButton.disabled = true;
      statusEl.textContent = 'Consultando modelos…';
      try {
        const response = await fetch('/v1/models', { cache: 'no-store', credentials: 'same-origin' });
        const data = await response.json();
        if (response.status === 401) return showSignedOut('La sesión ha caducado. Vuelve a iniciar sesión.');
        if (!response.ok) throw new Error(data.error?.message || data.error || `HTTP ${response.status}`);
        const models = data.data || [];
        modelSelect.replaceChildren();
        if (!models.length) {
          modelSelect.add(new Option('No hay workers con modelos', ''));
          statusEl.textContent = 'Registra un worker H0 antes de enviar mensajes.';
          return;
        }
        models.forEach(item => {
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = item.id;
        modelSelect.append(option);
        });
        modelSelect.value = models[0].id;
        modelSelect.disabled = false;
        sendButton.disabled = Boolean(pendingJobId);
        statusEl.textContent = `${models.length} modelo(s) anunciado(s).`;
      } catch (error) {
        modelSelect.replaceChildren(new Option('Servicio no disponible', ''));
        statusEl.textContent = `No se pudo consultar modelos: ${error.message}`;
      }
    }

    function showSignedOut(message = '') {
      authenticated = false;
      authPanel.hidden = false;
      authenticatedApp.hidden = true;
      logoutButton.hidden = true;
      authStatus.textContent = message;
      history.length = 0;
      messagesEl.replaceChildren();
      pendingJobId = '';
      clearPendingJob();
      recoveryPanel.hidden = true;
    }

    function showSignedIn(username) {
      authenticated = true;
      authPanel.hidden = true;
      authenticatedApp.hidden = false;
      logoutButton.hidden = false;
      signedInAs.textContent = username ? `Sesión iniciada como ${username}` : 'Sesión iniciada';
      pendingJobId = readPendingJob();
      if (JOB_ID_PATTERN.test(pendingJobId)) showPendingJob(pendingJobId);
      else { pendingJobId = ''; clearPendingJob(); }
      loadModels();
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginButton.disabled = true;
      authStatus.textContent = 'Validando credenciales…';
      const credentials = {
        username: usernameInput.value.trim(),
        password: passwordInput.value
      };
      try {
        const response = await fetch('/auth/login', {
          method: 'POST', credentials: 'same-origin', cache: 'no-store',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(credentials)
        });
        passwordInput.value = '';
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || data.error || 'Credenciales no válidas');
        await checkSession();
      } catch (error) {
        passwordInput.value = '';
        authStatus.textContent = `No se pudo iniciar sesión: ${error.message}`;
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      try {
        const response = await fetch('/auth/logout', {
          method: 'POST', credentials: 'same-origin', cache: 'no-store'
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error?.message || data.error || `HTTP ${response.status}`);
        }
        showSignedOut('Has cerrado sesión.');
      } catch (error) {
        statusEl.textContent = `No se pudo cerrar sesión: ${error.message}`;
      } finally {
        logoutButton.disabled = false;
      }
    });

    async function checkSession() {
      try {
        const response = await fetch('/auth/session', { cache: 'no-store', credentials: 'same-origin' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const session = await response.json();
        if (session.authenticated === true) showSignedIn(session.username || '');
        else showSignedOut();
      } catch (error) {
        showSignedOut(`No se pudo comprobar la sesión: ${error.message}`);
      }
    }

    checkSession();

    resumeJobButton.addEventListener('click', async () => {
      if (!authenticated) return;
      const jobId = pendingJobInput.value.trim();
      if (!JOB_ID_PATTERN.test(jobId)) {
        statusEl.textContent = 'Introduce un ID de trabajo válido, por ejemplo job_000001.';
        return;
      }
      showPendingJob(jobId);
      resumeJobButton.disabled = true;
      statusEl.textContent = `Consultando ${jobId}; el estado se revisará durante un máximo de 30 minutos…`;
      try {
        const answer = await recoverTimedOutJob(jobId, 360);
        history.push({ role: 'assistant', content: answer });
        addMessage('assistant', answer);
        pendingJobId = '';
        pendingJobInput.value = '';
        recoveryPanel.hidden = true;
        clearPendingJob();
        sendButton.disabled = !modelSelect.value;
        statusEl.textContent = `${jobId}: respuesta recuperada.`;
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        resumeJobButton.disabled = false;
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!authenticated) return;
      const content = promptInput.value.trim();
      if (!content || !modelSelect.value) return;
      const currentChars = history.reduce((sum, message) => sum + message.content.length, 0);
      if (currentChars + content.length > MAX_TOTAL_CHARS) {
        statusEl.textContent = `El historial supera el límite de ${MAX_TOTAL_CHARS.toLocaleString()} caracteres.`;
        return;
      }
      const userMessage = { role: 'user', content };
      history.push(userMessage);
      addMessage('user', content);
      promptInput.value = '';
      sendButton.disabled = true;
      let requestJobId = '';
      statusEl.textContent = 'Esperando al worker…';
      try {
        const body = JSON.stringify({
          model: modelSelect.value,
          messages: history,
          max_tokens: Number(document.querySelector('#tokens').value),
          timeout_s: 1800,
          stream: false
        });
        if (new TextEncoder().encode(body).byteLength > MAX_REQUEST_BYTES) {
          throw new Error('La petición supera el límite de 1 MiB del servicio.');
        }
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body
        });
        const data = await response.json();
        if (response.status === 401) {
          showSignedOut('La sesión ha caducado. Vuelve a iniciar sesión.');
          return;
        }
        if (response.status === 504 && data.error?.job_id) {
          requestJobId = data.error.job_id;
          showPendingJob(requestJobId);
          statusEl.textContent = `Tiempo de espera; recuperando ${requestJobId}…`;
          data.choices = [{ message: { content: await recoverTimedOutJob(requestJobId) } }];
        }
        if (!response.ok && response.status !== 504) {
          throw new Error(data.error?.message || data.error || `HTTP ${response.status}`);
        }
        if (response.status === 504 && !data.error?.job_id) {
          throw new Error(data.error?.message || 'HTTP 504 sin ID de trabajo recuperable');
        }
        const answer = data.choices?.[0]?.message?.content;
        if (typeof answer !== 'string') throw new Error('Respuesta H0 sin choices[0].message.content');
        history.push({ role: 'assistant', content: answer });
        addMessage('assistant', answer);
        pendingJobId = '';
        pendingJobInput.value = '';
        recoveryPanel.hidden = true;
        clearPendingJob();
        statusEl.textContent = `${data.usage?.total_tokens ?? 0} tokens · ${data.model || 'modelo'}`;
      } catch (error) {
        if (!requestJobId) {
          history.pop();
          promptInput.value = content;
        } else {
          statusEl.textContent = `${requestJobId} sigue pendiente. Usa «Continuar consulta» para reanudar.`;
        }
        addMessage('assistant', `Error: ${error.message}`);
      } finally {
        sendButton.disabled = Boolean(pendingJobId) || !modelSelect.value;
        promptInput.focus();
      }
    });
  </script>
</body>
</html>
